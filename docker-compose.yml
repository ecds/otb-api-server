

services:
  postgres:
    image: postgis/postgis:14-3.2
    platform: linux/amd64
    environment:
      POSTGRES_DB: otb_development
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d otb_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_ADAPTER: postgresql
      DB_HOSTNAME: postgres
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_NAME: otb_development
      TEST_DB_NAME: otb_test
      
      REDIS_URL: redis://redis:6379/1
      
      RAILS_ENV: development
      RAILS_SERVE_STATIC_FILES: "true"
      
      BASE_URL: "https://localhost:3000"
      
      IPINFO_TOKEN: "development_token"
    volumes:
      - .:/rails
      - tmp_data:/data/tmp
      - storage_tmp:/rails/public/storage/tmp
      - ssl_certs:/rails/ssl  
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: >
      bash -c "
        echo 'Installing dependencies...' &&
        bundle install &&
        echo 'Creating necessary directories...' &&
        mkdir -p /data/tmp public/storage/tmp tmp/pids ssl &&
        chmod 777 /data/tmp public/storage/tmp &&
        echo 'Generating self-signed SSL certificate...' &&
        openssl req -x509 -newkey rsa:4096 -keyout ssl/key.pem -out ssl/cert.pem -days 365 -nodes -subj '/CN=localhost' &&
        echo 'Setting up database...' &&
        RAILS_ENV=development bundle exec rails db:create 2>/dev/null || echo 'Database already exists' &&
        RAILS_ENV=development bundle exec rails db:test:prepare 2>/dev/null || echo 'Test database setup complete' &&
        echo 'Loading schema (skipping problematic migrations)...' &&
        RAILS_ENV=development bundle exec rails db:schema:load &&
        echo 'Starting Rails server with HTTPS...' &&
        RAILS_ENV=development bundle exec puma -b 'ssl://0.0.0.0:3000?key=ssl/key.pem&cert=ssl/cert.pem'
      "

volumes:
  postgres_data:
  redis_data:
  tmp_data:
  storage_tmp:
  ssl_certs:  