name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  RAILS_ENV: test
  PGUSER: postgres
  DB_HOSTNAME: localhost
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  TEST_DB_NAME: otb_test
  CI: 'github-actions'
  BROWSER_PATH: /usr/bin/google-chrome

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: otb_test
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.2
        bundler-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client imagemagick libpq-dev gdal-bin libgdal-dev libappindicator1 fonts-liberation
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || true
        sudo apt-get install -f -y

    - name: Create required directories
      run: |
        sudo mkdir -p /data/tmp
        sudo chmod 777 /data/tmp
        sudo chown $USER:$USER /data/tmp
        mkdir -p public/storage/tmp
        chmod 777 public/storage/tmp

    - name: Wait for databases to be ready
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword --silent; do
          echo "Waiting for MySQL..."
          sleep 2
        done

    - name: Set up PostgreSQL database
      run: |
        export DB_ADAPTER=postgresql
        bundle exec rake db:drop RAILS_ENV=test DB_ADAPTER=postgresql || true
        bundle exec rake db:create RAILS_ENV=test DB_ADAPTER=postgresql
        bundle exec rake db:schema:load RAILS_ENV=test DB_ADAPTER=postgresql
        bundle exec rake db:migrate RAILS_ENV=test DB_ADAPTER=postgresql

    - name: Run RSpec tests
      run: |
        DB_ADAPTER=postgresql bundle exec rspec --format progress --format RspecJunitFormatter --out tmp/rspec.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: tmp/rspec.xml

    - name: Upload coverage to Coveralls
      if: github.event_name == 'push'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./coverage/lcov.info
      continue-on-error: true